name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Verify release tag
        shell: bash
        run: |
          version="$(dotnet msbuild src/Emby.Zattoo.Plugin/Emby.Zattoo.Plugin.csproj -nologo -getProperty:Version)"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${version}." >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore Emby.Zattoo.sln

      - name: Build
        run: dotnet build Emby.Zattoo.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test Emby.Zattoo.sln --configuration Release --no-build --no-restore

      - name: Verify formatting
        run: dotnet format Emby.Zattoo.sln --verify-no-changes --no-restore

      - name: Package plugin
        shell: bash
        run: |
          mkdir -p release/Emby.Zattoo
          cp artifacts/Emby.Zattoo/Emby.Zattoo.dll release/Emby.Zattoo/
          (cd release && zip -r "Emby.Zattoo-${GITHUB_REF_NAME}.zip" Emby.Zattoo)
          (
            cd release
            sha256sum \
              Emby.Zattoo/Emby.Zattoo.dll \
              "Emby.Zattoo-${GITHUB_REF_NAME}.zip" \
              > SHA256SUMS.txt
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/Emby.Zattoo/Emby.Zattoo.dll \
            "release/Emby.Zattoo-${GITHUB_REF_NAME}.zip" \
            release/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "Emby.Zattoo ${GITHUB_REF_NAME}"
